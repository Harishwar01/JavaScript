<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>

<body>
    <h1>Document Object Model</h1>
    <ul class="ul1">
        <li>One</li>
        <li id="two">Two</li>
        <li>Three</li>
        <li>Four</li>
        <li>Five</li>
    </ul>


    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>PYTHON</li>
        <li>SQL</li>
    </ul>

    <ul>
        <li>One</li>
        <li>Two</li>
        <li id="ul3_li3">Three</li>
        <li>Four</li>
        <li>Five</li>
    </ul>

    <script>
        let p = document.getElementById("two")
        p.style.backgroundColor = "blue"

        let a = document.getElementById("ul3_li3")
        a.style.color = "red"

        let b = document.querySelectorAll('ul')
        b[1].style.backgroundColor = "yellow"

        let c = document.querySelector("ul")
        c.style.backgroundColor = 'green'

        let d = document.getElementsByClassName("ul1")
        d[0].style.color = 'red'
    </script>
</body>

</html>
